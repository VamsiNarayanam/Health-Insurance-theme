<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Stackly Canopy</title>
  <meta name="description" content="Open a Stackly Canopy policyholder account or a demo rain-desk seat. Named waiting periods apply. Quotes are not cashless guarantees.">
  <link rel="icon" href="images/favicon.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,600;1,9..144,450;1,9..144,560&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=auth2">
  <link rel="stylesheet" href="css/pages.css?v=auth2">
  <link rel="stylesheet" href="css/responsive.css?v=auth1">
</head>
<body class="grain auth-body">
  <a class="skip-link" href="#register-form">Skip to registration</a>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader-inner">
      <svg viewBox="0 0 200 220" fill="none">
        <path class="seed" d="M100 188c8-4 14-14 14-24 0-16-14-28-14-28s-14 12-14 28c0 10 6 20 14 24z" fill="#B86A3D"/>
        <path class="vein" d="M100 160V72" stroke="#F4EBD7" stroke-width="1.6" stroke-linecap="round" pathLength="1"/>
        <path class="canopy-draw" d="M100 78c-28 4-54 28-62 58 18 6 40-2 62-18 22 16 44 24 62 18-8-30-34-54-62-58z" fill="none" stroke="#F4EBD7" stroke-width="1.8" pathLength="1"/>
        <path class="canopy-draw" d="M100 70c-18-22-8-46 12-52 8 16 4 34-12 52z" fill="none" stroke="#E8D9C0" stroke-width="1.4" pathLength="1"/>
        <path class="canopy-draw" d="M100 70c18-22 8-46-12-52-8 16-4 34 12 52z" fill="none" stroke="#E8D9C0" stroke-width="1.4" pathLength="1"/>
        <path class="canopy-fill" d="M100 78c-28 4-54 28-62 58 18 6 40-2 62-18 22 16 44 24 62 18-8-30-34-54-62-58z" fill="#2F6A4A" opacity="0"/>
      </svg>
      <p>Raising the canopy…</p>
      <div class="copper-ring" style="--p:0"></div>
    </div>
  </div>

  <main class="auth-shell">
    <div class="auth-card auth-card-wide">
      <a class="mark auth-card-mark" href="index.html" aria-label="Stackly Canopy home">
        <img class="mark-logo" src="images/stackly-canopy.webp" alt="" width="176" height="72">
      </a>
      <p class="kicker" data-enrol-kicker>Enrolment</p>
      <h1>Create an account</h1>
      <p class="auth-lead" data-enrol-lead>Tell us who stands under the canopy, or who sits the rain desk. This demo keeps the account in your browser.</p>
      <form id="register-form" novalidate>
        <fieldset class="field role-field">
          <legend>Account type</legend>
          <div class="role-row">
            <label>
              <input type="radio" name="role" value="policyholder" checked>
              <span>Policyholder</span>
            </label>
            <label>
              <input type="radio" name="role" value="underwriter">
              <span>Underwriter</span>
            </label>
          </div>
        </fieldset>
        <div class="field">
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" required minlength="2" autocomplete="name" placeholder="Name as on PAN">
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="city">City of residence</label>
            <input id="city" name="city" required autocomplete="address-level2" placeholder="As on address proof">
          </div>
          <div class="field">
            <label for="mobile">Mobile number</label>
            <input id="mobile" name="mobile" required pattern="[0-9 +\-]{10,15}" inputmode="tel" autocomplete="tel" placeholder="10-digit mobile">
          </div>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="name@email.com" spellcheck="false">
        </div>
        <div class="field" data-holder-only>
          <label for="product">Cover of interest</label>
          <select id="product" name="product" required>
            <option value="" disabled selected>Select a cover line</option>
            <option>Canopy Kin</option>
            <option>Canopy Solo</option>
            <option>Canopy Crest</option>
            <option>Canopy Elder</option>
            <option>Canopy Bloom</option>
            <option>Canopy Pulse</option>
            <option>Canopy Forge</option>
            <option>Canopy Guild</option>
          </select>
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="password">Password</label>
            <div class="pwd-wrap">
              <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
              <button class="pwd-toggle" type="button" aria-pressed="false">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <div class="pwd-wrap">
              <input id="confirm" name="confirm" type="password" required minlength="6" autocomplete="new-password" placeholder="Re-enter password">
              <button class="pwd-toggle" type="button" aria-pressed="false">Show</button>
            </div>
          </div>
        </div>
        <label class="check">
          <input type="checkbox" name="terms" required>
          <span data-terms-holder>I have read the specimen terms and the named waiting periods. GST at 18% applies on premium.</span>
          <span data-terms-desk hidden>I understand this is a demo rain-desk seat. Hours Mon–Sat 08:00–20:00 IST. No live TPA is appointed.</span>
        </label>
        <p class="field-error" data-form-err></p>
        <button class="btn btn-copper auth-submit" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already enrolled? <a href="login.html">Sign in</a></p>
      <a class="auth-back" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/canopy-data.js"></script>
  <script src="js/gsap-init.js"></script>
  <script src="js/main.js?v=auth7"></script>
</body>
</html>
